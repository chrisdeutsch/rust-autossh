name: CI

on:
  #push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build
        run: cargo build --locked --release --target=${{ matrix.job.target }}

      - name: Get binary path
        id: binary-path
        run: |
          prefix=target/${{ matrix.job.target }}/release

          case ${{ matrix.job.target }} in
            *-windows*) echo "path=${prefix}/autossh.exe" >> $GITHUB_OUTPUT;;
            *) echo "path=${prefix}/autossh" >> $GITHUB_OUTPUT;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: autossh-${{ matrix.job.target }}
          path: ${{ steps.binary-path.outputs.path }}
          if-no-files-found: error
