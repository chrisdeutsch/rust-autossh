name: CI

on:
  pull_request:

defaults:
  run:
    shell: bash -eu {0}

jobs:
  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: ${{ matrix.job.cross }}
        run: cargo install cross

      - name: Build
        run: |
          if ${{ matrix.job.cross }}; then
            cross build --locked --release --target=${{ matrix.job.target }}
          else
            cargo build --locked --release --target=${{ matrix.job.target }}
          fi

      - name: Binary path
        id: binary-path
        run: |
          prefix=target/${{ matrix.job.target }}/release

          case ${{ matrix.job.target }} in
            *-windows-*) bin_name="autossh.exe";;
            *) bin_name="autossh";;
          esac

          echo "path=${prefix}/${bin_name}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: autossh-${{ matrix.job.target }}
          path: ${{ steps.binary-path.outputs.path }}
          if-no-files-found: error
