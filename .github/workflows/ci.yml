name: CI

on:
  pull_request:

defaults:
  run:
    shell: bash -eu {0}

jobs:
  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Build
        run: cargo build --locked --release --target=${{ matrix.job.target }}

      - name: Binary path
        id: binary-path
        run: |
          prefix=target/${{ matrix.job.target }}/release

          case ${{ matrix.job.target }} in
            *-windows-*) bin_name="autossh.exe";;
            *) bin_name="autossh";;
          esac

          echo "path=${prefix}/${bin_name}" >> $GITHUB_OUTPUT

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: autossh-${{ matrix.job.target }}
          path: ${{ steps.binary-path.outputs.path }}
          if-no-files-found: error
